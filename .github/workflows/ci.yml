name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit-test:
    name: Backend unit tests (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: ./gradlew test
        run: ./gradlew test --console=plain

  backend-integration-test:
    name: Backend integration tests (Testcontainers, needs Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: ./gradlew integrationTest
        run: ./gradlew integrationTest --console=plain

  ui-test:
    name: UI unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  helm-validate:
    name: Helm lint + template (dev/staging/prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.15.3"
      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami
      - name: helm dependency update
        run: helm dependency update charts/deployable-microservices
      - name: helm lint (every chart)
        run: |
          helm lint charts/product-service
          helm lint charts/order-service
          helm lint charts/api-gateway
          helm lint charts/ui
          helm lint charts/deployable-microservices
      - name: helm template (every environment overlay)
        run: |
          for env in dev staging prod; do
            echo "== values-$env.yaml =="
            helm template bookstore charts/deployable-microservices \
              -f charts/deployable-microservices/values-$env.yaml > /dev/null
          done

  docker-build:
    name: Build container images (no push)
    runs-on: ubuntu-latest
    needs: [backend-unit-test, ui-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build product-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product-service/Dockerfile
          push: false
          tags: product-service:ci
      - name: Build order-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/order-service/Dockerfile
          push: false
          tags: order-service:ci
      - name: Build api-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: false
          tags: api-gateway:ci
      - name: Build ui
        uses: docker/build-push-action@v6
        with:
          context: ui
          file: ui/Dockerfile
          push: false
          tags: ui:ci
