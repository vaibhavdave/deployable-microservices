spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8081}

resilience4j:
  retry:
    # Default retryAspectOrder (LOWEST_PRECEDENCE-4) is lower than the default
    # circuitBreakerAspectOrder (LOWEST_PRECEDENCE-3), which makes Retry the outer
    # aspect. With CircuitBreaker's fallbackMethod as the inner aspect, the first
    # failure gets swallowed into the fallback before Retry ever sees an exception
    # to retry. Explicitly reversing the order (CircuitBreaker outer, Retry inner)
    # makes retries happen first, with the fallback only firing once they're exhausted.
    retry-aspect-order: 2
    instances:
      productService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          # 5xx responses from product-service (e.g. it's temporarily down/overloaded).
          # 409/404 never reach here -- ProductServiceClient converts those to
          # ProductClientException, a business outcome, before Resilience4j sees them.
          - org.springframework.web.reactive.function.client.WebClientResponseException
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      productService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        ignore-exceptions:
          - com.bookstore.order.client.ProductClientException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
